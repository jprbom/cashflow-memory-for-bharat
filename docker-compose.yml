services:
  backend:
    build: ./backend
    ports:
      - "4103:4103"
    environment:
      PORT: 4103
      CORS_ORIGIN: http://127.0.0.1:5173
      DB_FILE: /app/data/app-db.json
    volumes:
      - ./data:/app/data
  frontend:
    build: ./frontend
    ports:
      - "5103:80"
    depends_on:
      - backend

